[package]
name = "freergb-effects"
description = "Software lighting effects: declarative effect format, pure renderer, and a frame-loop engine over an RGB backend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
freergb-sdk = { path = "../freergb-sdk" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
freergb-mock = { path = "../freergb-mock" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "test-util", "net"] }
