name: Windows installer
# Manual: Actions tab -> "Windows installer" -> Run workflow. Produces an NSIS
# installer and the bare exe as a downloadable artifact. The installer bundles
# OpenRGB 1.1 and runs it as a service. Releases come from release.yml instead.
on:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: ui
      # The installer bundles a pinned OpenRGB (tauri.windows.conf.json).
      - run: tools/ci/fetch-openrgb.sh
        shell: bash
      # beforeBuildCommand in tauri.conf.json builds the UI.
      - run: npx --yes @tauri-apps/cli@2 build --bundles nsis
        working-directory: crates/freergb-app
      # Prints each step of the sound capture, for a machine where sound reads nothing.
      - run: cargo build --release -p freergb-sources --example sound_probe
      - uses: actions/upload-artifact@v4
        with:
          name: freergb-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/freergb-app.exe
            target/release/examples/sound_probe.exe
          if-no-files-found: error
