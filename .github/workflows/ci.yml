name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The app crate embeds ui/dist at compile time, so build the UI first.
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # The Windows bundle config names the pinned OpenRGB as a resource, which the app's
      # build script requires to exist (the release workflow fetches it the same way).
      - name: Bundled OpenRGB (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: tools/ci/fetch-openrgb.sh
      - name: Sensor service (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: tools/ci/build-sensord.sh
      # For the Store package (the installer uses PawnIO's own copy).
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: PawnIOLib from source (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: tools/ci/build-pawniolib.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: pawniolib
          path: target/pawniolib/PawnIOLib.dll
          if-no-files-found: error
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Leak check (spec: the one resource target that fails CI). Memory is read from /proc.
      - name: Soak (leak check)
        if: runner.os == 'Linux'
        run: cargo run --release -p freergb-effects --example soak -- --secs 120
